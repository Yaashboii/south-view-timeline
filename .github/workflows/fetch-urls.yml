name: Fetch listed photos
on:
  push:
    paths: [".github/workflows/fetch-urls.yml", "tools/fetch_urls.py"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pillow
      - run: python tools/fetch_urls.py
      - name: Commit
        run: |
          git config user.name "photo-bot"
          git config user.email "photo-bot@users.noreply.github.com"
          git add images
          git diff --cached --quiet || (git commit -m "Fetch listed photos for review" && git push)
